<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="Persona card frame">
  <title>Persona card frame</title>
  <desc>Decorative frame for a Sales Arena persona card. The inner rect at 280x400 hosts the persona's avatar and bio.</desc>
  <defs>
    <linearGradient id="frameBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
  </defs>
  <rect width="360" height="480" rx="14" fill="url(#frameBg)"/>
  <rect x="12" y="12" width="336" height="456" rx="10" fill="none" stroke="#E6C46B" stroke-width="2"/>
  <rect x="20" y="20" width="320" height="40" fill="#1F2C3E"/>
  <text x="180" y="48" font-family="serif" font-size="22" fill="#E6C46B" text-anchor="middle" letter-spacing="3">P E R S O N A</text>
  <rect x="40" y="80" width="280" height="320" fill="#181818"/>
  <text x="180" y="430" font-family="sans-serif" font-size="14" fill="#A88A3A" text-anchor="middle">DNA Sales Arena</text>
</svg>
