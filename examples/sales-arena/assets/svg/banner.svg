<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="DNA Sales Arena banner">
  <title>DNA Sales Arena</title>
  <desc>Vintage trading-floor banner with the Sales Arena wordmark and a closing-bell icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2C3E"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6C46B"/>
      <stop offset="100%" stop-color="#8A6418"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="200" fill="none" stroke="#E6C46B" stroke-width="2"/>
  <g transform="translate(160 120)">
    <circle cx="0" cy="0" r="64" fill="url(#brass)" stroke="#E6C46B" stroke-width="3"/>
    <rect x="-8" y="-72" width="16" height="20" fill="#E6C46B" rx="2"/>
    <rect x="-3" y="40" width="6" height="20" fill="#3F2A0A"/>
    <circle cx="0" cy="68" r="6" fill="#3F2A0A"/>
  </g>
  <g font-family="serif" fill="#E6C46B" font-weight="700">
    <text x="280" y="120" font-size="56" letter-spacing="6">D N A   S A L E S   A R E N A</text>
    <text x="280" y="170" font-size="22" letter-spacing="4" fill="#A88A3A" font-style="italic">— the leads are deterministic, scored, and replayable —</text>
  </g>
</svg>
