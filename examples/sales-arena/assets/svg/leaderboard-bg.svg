<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Leaderboard background panel">
  <title>Leaderboard background</title>
  <desc>Vintage trading-board background. Subtle horizontal rules at 80-pixel intervals match the manager-UI persona row height. No animation, no external references.</desc>
  <defs>
    <linearGradient id="lbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16202C"/>
      <stop offset="100%" stop-color="#080C12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#lbBg)"/>
  <g stroke="#1F2C3E" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
  </g>
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#E6C46B" stroke-width="2" opacity="0.4"/>
</svg>
