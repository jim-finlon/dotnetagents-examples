## Persona pack — top-level config
## Edit this file to name your closer, set their style hints, and pick a model tier.

name: "Your Persona Name"
author: "your-handle"
version: "0.1.0"

## Model tier hint — the orchestrator routes touches based on this.
##   local-light             — fast, cheap, good for cold volume
##   local-strong            — better reasoning, slower, good for objections + proposals
##   frontier-fallback       — premium routing (operator opt-in; defaults to local-strong)
model_tier: "local-strong"

## Tags shown in the Gallery and used by the matchmaker.
tags:
  - "your-style-tag"

## File references (relative to this directory).
bio_ref: "bio.md"
system_prompt_ref: "system-prompt.md"
cadence_ref: "cadence.yaml"
behavior_tree_ref: "behavior-tree.yaml"   # optional; defaults supplied if missing

## Channel posture overrides — leave empty to inherit from cadence.yaml.
channel_overrides: {}

## Display config for the Manager UI.
display:
  avatar_ref: "avatar.svg"
  primary_color: "#5A6FFF"
  accent_color: "#FFC857"
  catchphrase: "Always be character-distinct."
