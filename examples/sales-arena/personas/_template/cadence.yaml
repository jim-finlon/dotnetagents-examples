## Cadence config — how often your persona touches prospects, and on what channels.
## Tune these to match your persona's style. Roma is patient; Levene is relentless.

## Daily limits (hard caps — the rate limiter enforces these)
daily_limits:
  total_touches: 50          # max outbound touches/day across all channels
  emails: 25
  sms: 10
  linkedin_dms: 10
  chat_messages: 5

## Default channel mix (% of touches per channel)
channel_mix:
  email: 50
  sms: 20
  linkedin: 20
  chat: 10

## Follow-up rules — when to re-touch a prospect that hasn't replied
follow_up:
  first_followup_after_hours: 48
  second_followup_after_hours: 96
  third_followup_after_hours: 168
  switch_channel_after_ignored: 3        # try another channel after N silent touches
  decay_to_nurture_after_ignored: 5      # give up after this many

## Time-of-day preferences (24h, persona's timezone unless overridden)
preferred_send_hours:
  weekday: [9, 11, 14, 16]
  weekend: []                # empty = never on weekends

## Risk posture
risk_posture:
  aggressive_close: false    # set true for Levene/Hardballer types
  consultative_pace: true    # set true for Roma/Engineer types
  objection_pre_arm: false   # set true for Moss

## Send-gate (operator preview-confirm)
send_gate:
  preview_required_for_first_n: 25      # operator approves first 25 sends
  auto_send_after_quality_threshold: true
