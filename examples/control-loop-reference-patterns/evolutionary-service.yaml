id: evolutionary-service
serviceClass: evolutionary_service
purpose: >
  Run experiments, mutations, evaluations, and promotions where variants must be
  reproducible, scored, and traceable back to recipes, genes, and evidence.
  Use for prompt evolution, local simulator runs, routing trials, and model-policy
  experiments.
pilotBaseline:
  service: PublicPromptVariantService
  storyUse: "Evolutionary-service pilot and experiment-driven workflow stories"
layers:
  chainLogic:
    owns:
      - generate candidate variant
      - critique candidate
      - summarize evaluation outcome
    mustNotOwn:
      - population state
      - promotion decision
      - budget accounting
  workflow:
    owns:
      - recipe validation
      - population launch
      - generation loop
      - evaluator execution
      - selection and promotion proposal
  lifecycleState:
    states:
      - draft_recipe
      - validated
      - running_generation
      - evaluating
      - selecting
      - promotion_pending
      - promoted
      - quarantined
      - archived
    transitionRule: "Variant acceptance requires evaluation evidence and policy approval."
  reactivePolicy:
    role: "Experiment guardrails"
    examples:
      - stop run when budget is exhausted
      - quarantine variant when safety score regresses
      - require human review when novelty exceeds threshold
  governance:
    gates:
      - recipe schema validation
      - gene lock policy
      - budget ceiling
      - evaluator quorum
      - promotion lane policy
      - rollback or quarantine plan
    forbiddenActions:
      - mutating locked genes
      - promoting variants without scorecard evidence
      - using secrets as gene values
  observability:
    requiredDimensions:
      - dna.actor.id
      - experiment.id
      - experiment.run_id
      - experiment.population_id
      - prompt.gene_id
      - correlation.runId
    events:
      - experiment.recipe.validated
      - population.generation.started
      - variant.evaluated
      - selection.completed
      - promotion.proposed
      - variant.quarantined
safeDefaults:
  promotionLane: lab_only
  requiresEvaluatorQuorum: true
  mutationIntensityMax: 1.0
  storesSecrets: false
implementationNotes:
  - "Recipes are the design-time contract; runs and evaluations are the evidence."
  - "Treat every visible score as a projection over durable evaluation records."
  - "Promotion decisions should cite scorecards and variant registry entries."
