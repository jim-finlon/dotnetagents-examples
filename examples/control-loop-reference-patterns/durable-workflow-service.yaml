id: durable-workflow-service
serviceClass: durable_workflow
purpose: >
  Coordinate long-running work where every stage must be resumable, auditable,
  and safe to retry. Use for SDLC story execution, release trains, migration
  waves, and other operator-visible workflows.
pilotBaseline:
  service: SdlcAgent
  storyUse: "Autonomous loop lifecycle and release workflow stories"
layers:
  chainLogic:
    owns:
      - classify requested work
      - draft next action
      - summarize evidence
    mustNotOwn:
      - durable stage state
      - retry budget
      - deployment authority
  workflow:
    owns:
      - stage order
      - retries and backoff
      - compensation steps
      - review and QA gates
    exampleStages:
      - intake
      - plan
      - implement
      - validate
      - review
      - closeout
  lifecycleState:
    states:
      - queued
      - planning
      - executing
      - validating
      - blocked
      - completed
      - cancelled
    transitionRule: "All transitions emit correlated evidence and preserve resume tokens."
  reactivePolicy:
    role: "Secondary"
    examples:
      - pause workflow when CI fails repeatedly
      - route to anomaly lane when deploy evidence is missing
  governance:
    gates:
      - story readiness
      - expected path and submodule boundary
      - test evidence
      - closeout evidence
    privilegedActions:
      - merge to main
      - deploy to Tyr
    privilegedActionRule: "Require explicit policy and evidence before mutation."
  observability:
    requiredDimensions:
      - dna.actor.id
      - sdlc.story_id
      - sdlc.epic_id
      - correlation.runId
      - correlation.branch
      - correlation.commitSha
    events:
      - workflow.stage.started
      - workflow.stage.completed
      - workflow.stage.failed
      - workflow.gate.blocked
      - workflow.closeout.recorded
safeDefaults:
  maxRetriesPerStage: 2
  requiresHumanReviewForDeploy: true
  storesSecrets: false
implementationNotes:
  - "Keep LLM chains idempotent and side-effect free."
  - "Put durable orchestration in workflow/state primitives, not prompt text."
  - "Use SDLC closeout as the durable evidence boundary."
