id: guarded-control-plane-service
serviceClass: guarded_control_plane
purpose: >
  Manage high-impact infrastructure, deployment, or runtime authority through
  preview-first plans, explicit confirmation, blast-radius policy, and durable
  receipts. Use when a service can change shared infrastructure or production
  posture.
pilotBaseline:
  service: InfrastructureControl
  storyUse: "Mutation lifecycle, drift watchdog, and Prime control-plane policy stories"
layers:
  chainLogic:
    owns:
      - interpret operator intent
      - explain a plan
      - summarize drift
    mustNotOwn:
      - applying mutations
      - confirmation tokens
      - privilege escalation
  workflow:
    owns:
      - plan generation
      - policy evaluation
      - evidence collection
      - apply orchestration after confirmation
      - rollback or quarantine workflow
  lifecycleState:
    states:
      - observing
      - planning
      - awaiting_confirmation
      - applying
      - verifying
      - rolled_back
      - quarantined
      - completed
    transitionRule: "Any applying state requires a signed or policy-valid confirmation token."
  reactivePolicy:
    role: "Drift and watchdog"
    examples:
      - detect privilege drift
      - route unsafe mutation to quarantine plan
      - pause deploy when required service health is degraded
  governance:
    gates:
      - Prime authority policy
      - blast-radius classification
      - preview before apply
      - confirmation phrase or token
      - backup or rollback evidence
      - target environment class policy
    privilegedActions:
      - apply infrastructure change
      - change runtime authority
      - destroy or quarantine managed environment
  observability:
    requiredDimensions:
      - dna.actor.id
      - infrastructure.plan_id
      - infrastructure.environment_id
      - sdlc.story_id
      - correlation.commitSha
    events:
      - control_plane.plan.created
      - control_plane.policy.evaluated
      - control_plane.confirmation.issued
      - control_plane.apply.started
      - control_plane.apply.completed
      - control_plane.rollback.started
safeDefaults:
  defaultAdapterMode: planning
  liveMutationRequiresConfig: true
  requiresBackupEvidence: true
  storesSecrets: false
implementationNotes:
  - "The default adapter should plan only; live adapters must be explicit."
  - "Separate plan, apply, verify, and receipt records."
  - "Never hide policy denial inside a successful LLM explanation."
