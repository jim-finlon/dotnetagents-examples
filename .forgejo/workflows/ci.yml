name: examples-public-readiness

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scan tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Public content scan
        run: bash scripts/verify-example-quality.sh --skip-build --skip-smoke --scan-scope all
